<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>{% block title %}ZeroDayZ | Hostel Complaint Management{% endblock %}</title>
  <meta name="description" content="{% block description %}ZeroDayZ is a hostel complaint management portal for students, staff and admins.{% endblock %}">
  <meta name="robots" content="{% block robots %}index, follow{% endblock %}">
  <meta name="theme-color" content="#d9eeff">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23bfe3ff'/%3E%3Crect x='19' y='10' width='26' height='44' rx='3' fill='%23fff' stroke='%231672b3' stroke-width='4'/%3E%3Ccircle cx='38' cy='33' r='3' fill='%231672b3'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='styles/base.css') }}">
  {% block head_extra %}{% endblock %}
</head>

<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}" aria-label="ZeroDayZ home">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <rect x="7" y="3" width="18" height="26" rx="2.500" fill="#fff" stroke="currentColor" stroke-width="2.500"/>
        <circle cx="20.500" cy="16.500" r="1.800" fill="currentColor"/>
      </svg>
      <span class="brand__name">ZeroDayZ</span>
    </a>
    <p class="site-header__tag">Hostel complaint management</p>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ current_year }} ZeroDayZ hostel complaint management</p>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
